<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Track Your Claim</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background-color: #0e0e0e;
            color: #ff6600;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        form {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        input[type="number"] {
            padding: 10px;
            border: 1px solid #ff6600;
            background-color: #1a1a1a;
            color: white;
            border-radius: 5px;
            width: 250px;
        }

        button {
            padding: 10px 15px;
            margin-left: 10px;
            background-color: #ff6600;
            border: none;
            color: black;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ffa533;
        }

        #claim-result {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ff6600;
            max-width: 600px;
            margin: auto;
        }

        #claim-result h3 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Track Your Insurance Claim</h1>

    <form id="claim-search-form">
        <input type="number" id="claim-id" placeholder="Enter your Claim ID" required>
        <button type="submit">Search</button>
    </form>

    <div id="claim-result"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('claim-search-form');
            const result = document.getElementById('claim-result');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const claimId = document.getElementById('claim-id').value;

                result.innerHTML = '<p>Searching...</p>';

                try {
                    const response = await fetch(`/api/claims/${claimId}`);
                    const data = await response.json();

                    if (response.ok) {
                        result.innerHTML = `
                            <h3>Status: ${data.status}</h3>
                            <p><strong>Claimant:</strong> ${data.claimant_name}</p>
                            <p><strong>Claim Type:</strong> ${data.claim_type}</p>
                            <p><strong>Incident Date:</strong> ${data.incident_date}</p>
                            <p><strong>Amount:</strong> R${data.claim_amount}</p>
                            <p><strong>Description:</strong> ${data.description}</p>
                            <p><strong>Location:</strong> ${data.incident_location}</p>
                            <p><strong>Contact:</strong> ${data.contact_number}</p>
                            <p><strong>Email:</strong> ${data.email}</p>
                        `;
                    } else {
                        result.innerHTML = `<p style="color: red;">${data.error}</p>`;
                    }
                } catch (err) {
                    result.innerHTML = '<p style="color: red;">Error fetching claim data. Try again later.</p>';
                }
            });
        });
    </script>
</body>
</html>
