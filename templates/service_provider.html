<!DOCTYPE html>
<html>
<head>
    <title>Service Provider</title>
    <link rel="stylesheet" type="text/css" href="/static/styles.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body class="sp-background">
    <h1>Service Provider Notification Panel</h1>
    <div id="notification-panel"></div>
    <script>
        var socket = io();
        socket.on('receive_notification', function(data) {
            const panel = document.getElementById('notification-panel');
            const card = document.createElement('div');
            card.className = 'job-card';
            card.innerHTML = `<h3>${data.clientName} - ${data.skill}</h3>
                              <p>Job: ${data.jobDesc}</p>
                              <p>Appointment: ${data.appointment}</p>
                              <p>Distance: ${data.distance}</p>`;
            panel.appendChild(card);
        });
    </script>
</body>
</html>
