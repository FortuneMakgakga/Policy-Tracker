<!DOCTYPE html>
<html>
<head>
    <title>Register Service Provider</title>
</head>
<body>
    <h2>Register as a Service Provider</h2>
    <form method="POST" action="/submit_provider">
        <input type="text" name="name" placeholder="Name" required><br>
        <input type="email" name="email" placeholder="Email" required><br>
        <input type="text" name="phone" placeholder="Phone"><br>
        <input type="text" name="skill" placeholder="Skill" required><br>
        <input type="number" name="latitude" placeholder="Latitude" step="any"><br>
        <input type="number" name="longitude" placeholder="Longitude" step="any"><br>
        <input type="text" name="password" placeholder="Password" step="any"><br>
        <button type="submit">Submit</button>
    </form>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
                {% for category, message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
</body>
</html>
