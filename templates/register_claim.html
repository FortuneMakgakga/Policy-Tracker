<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claim Registration - Futuristic UI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <script defer src="{{ url_for('static', filename='scripts.js') }}"></script>
</head>
<body>
  <div class="container">
    <h1>🚀 Register a Claim</h1>
    <form id="claim-form">
      <label>Policy ID: <input type="number" id="policy_id" required /></label>
      <label>Claim Type:
        <select id="claim_type" required>
          <option value="Auto">Auto</option>
          <option value="Home">Home</option>
          <option value="Travel">Travel</option>
          <option value="Health">Health</option>
        </select>
      </label>
      <label>Incident Date: <input type="date" id="incident_date" required /></label>
      <label>Incident Location: <input type="text" id="incident_location" required /></label>
      <label>Description: <textarea id="description" required></textarea></label>
      <label>Claim Amount: <input type="number" step="0.01" id="claim_amount" required /></label>
      <h3>Claimant Details</h3>
      <label>Full Name: <input type="text" id="claimant_name" required /></label>
      <label>Contact Number: <input type="tel" id="contact_number" required /></label>
      <label>Email Address: <input type="email" id="email" required /></label>
      <button type="submit">Submit Claim</button>
    </form>
    <pre id="claim_result"></pre>

    <!-- Track Claim Section -->
    <h2>🔍 Track Your Claim</h2>
    <form id="track-form">
      <label>Claim ID: <input type="number" id="claim_id" required /></label>
      <button type="submit">Check Status</button>
    </form>
    <pre id="status_result"></pre>
  </div>
</body>
</html>
